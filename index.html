<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Shop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@200;500&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            color: var(--tg-theme-text-color, #000);
            background: var(--tg-theme-bg-color, #fff);
        }
        #main {
            width: 100%;
            padding: 30px;
            text-align: center;
        }
        h1 {
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 24px;
        }
        img {
            width: 120px;
            height: auto;
            border-radius: 10px;
            margin: 20px auto;
            display: block;
        }
        p {
            max-width: 300px;
            margin: 0 auto;
            line-height: 1.4;
        }
        button {
            border: 0;
            border-radius: 8px;
            margin-top: 30px;
            height: 50px;
            width: 200px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: background 300ms ease;
            color: var(--tg-theme-button-text-color, #ffffff);
            background: var(--tg-theme-button-color, #2481cc);
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
<div id="main">
    <h1>Онлайн магазин</h1>
    <img src="https://www.tasteofhome.com/wp-content/uploads/2018/01/Homemade-Pizza_EXPS_FT23_376_EC_120123_3.jpg" alt="Піца">
    <p>Смачна домашня піца зі свіжими інгредієнтами.</p>
    <button id="buy">Купити</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    document.getElementById("buy").addEventListener("click", function() {
        tg.sendData("Обрано товар: Піца");
    });
</script>
</body>
</html>
