<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Shop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@200;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            color: var(--tg-theme-text-color, #000);
            background: var(--tg-theme-bg-color, #fff);
        }
        #main {
            width: 100%;
            padding: 30px;
            text-align: center;
        }
        h1 {
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 24px;
        }
        img {
            width: 120px;
            height: auto;
            border-radius: 10px;
            margin: 20px auto;
            display: block;
        }
        p {
            max-width: 300px;
            margin: 0 auto;
            line-height: 1.4;
        }
        button {
            border: 0;
            border-radius: 8px;
            margin-top: 30px;
            height: 50px;
            width: 200px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: background 300ms ease;
            color: var(--tg-theme-button-text-color, #ffffff);
            background: var(--tg-theme-button-color, #2481cc);
        }
        button:hover {
            opacity: 0.9;
        }
        #form{
            display: none;
            text-align: center;
        }
        input{
            width: 90%;
            outline: none;
            margin: 10px 5%;
            padding: 15px 10px;
            font-size: 14px;
            border: 2px solid silver;
            border-radius: 5px;
        }
        input:focus{
            border-color: #db5d5d;
        }
    </style>
</head>
<body>
<div id="main">
    <h1>Онлайн магазин</h1>
    <img src="https://cdn-media.choiceqr.com/prod-eat-susharniabarkrakow/menu/meRzRxC-FyUOQwk-DtCjJrH.jpeg" alt="Суші-бургер">
    <p>Смачна домашня піца зі свіжими інгредієнтами.</p>
    <button id="buy">Купити</button>
</div>
<form id="form">
    <input type="text" placeholder="Ім'я" id="user_name">
    <input type="text" placeholder="Email" id="user_email">
    <input type="text" placeholder="Телефон" id="user_phone">
    <button id="order">Оформити</button>
  </form>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
      let tg = window.Telegram.WebApp;
      let buy = document.getElementById("buy");
      let order = document.getElementById("order");
      
      buy.addEventListener("click", () => {
          document.getElementById("main").style.display = "none";
          document.getElementById("form").style.display = "block";
          document.getElementById("user_name").value = tg.initDataUnsafe.user.first_name + " " + tg.initDataUnsafe.user.last_name;
      });
      
      order.addEventListener("click", () => {
          tg.close()
      });
    </script>
</body>
</html>
